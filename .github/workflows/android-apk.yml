name: Android Test APK

# 앱인토스 출시 전에 휴대폰에서 앱 형태로 플레이해 보기 위한 테스트 APK를 만듭니다(스토어 배포용 아님).
# - main 반영·수동 실행: APK를 만들어 Releases의 android-test-latest에 올립니다(휴대폰 브라우저에서 바로 받기).
# - 안드로이드 관련 PR: APK가 만들어지는지만 확인하고 실행 결과물로 남깁니다.

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'src/platform/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: android-test-latest
  APK_NAME: dream-bike-garage-test.apk

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      # 웹 빌드(--mode android) → android 프로젝트에 복사(cap sync)
      - run: npm run build:android

      # 고정 서명 키(GitHub 비밀값). 같은 키여야 새 APK로 덮어쓰기 설치가 되고 게임 진행이 유지됩니다.
      - name: 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "서명 키 비밀값이 없어 디버그 키로 서명합니다(덮어쓰기 설치 불가)."
          fi

      - name: APK 빌드
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/$APK_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: android-test-apk
          path: ${{ env.APK_NAME }}
          retention-days: 14

      # 휴대폰에서 로그인 없이 받을 수 있도록 고정 주소의 사전 출시(prerelease)로 올립니다. 매번 최신 빌드로 바꿉니다.
      - name: Releases에 최신 APK 올리기
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release delete "$RELEASE_TAG" --cleanup-tag --yes || true
          gh release create "$RELEASE_TAG" "$APK_NAME" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "안드로이드 테스트 APK (v$VERSION · 빌드 ${{ github.run_number }})" \
            --notes "앱인토스 출시 전 휴대폰 테스트용 APK입니다. 스토어 배포용이 아닙니다.

          - 커밋: ${GITHUB_SHA::7}
          - 버전: v$VERSION (빌드 ${{ github.run_number }})
          - 설치: 휴대폰 브라우저에서 아래 $APK_NAME 을 받아 설치합니다. 처음 한 번 '출처를 알 수 없는 앱 설치'를 허용해야 합니다.
          - 같은 서명 키로 만들어 이전 버전 위에 덮어쓰기 설치되고 진행이 유지됩니다."
